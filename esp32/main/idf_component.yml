dependencies:
  espressif/esp_websocket_client: "~1.2"
  espressif/cjson: "~1.7"
  espressif/led_strip: "~3.0"
  # The ESP32-P4 has no radio. On the M5Stack Tab5, Wi-Fi and BLE run on an
  # ESP32-C6 over SDIO: esp_wifi_remote provides the esp_wifi API and
  # esp_hosted carries it (and NimBLE's HCI) to the C6. The 2.x host line is
  # the one closest to the C6's factory firmware (esp_hosted slave 1.4.1).
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "~2.12.13"
    rules:
      - if: "target == esp32p4"
  # image_fetch.c's JPEG decoder: in ROM on the other chips, not on the P4.
  espressif/esp_jpeg:
    version: "^1.3.1"
    rules:
      - if: "target == esp32p4"
  idf:
    version: ">=5.1"
